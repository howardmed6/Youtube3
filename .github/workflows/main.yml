name: Make YouTube Short

on:
  repository_dispatch:
    types: [make_short]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg --fix-missing
        
      - name: Install dependencies
        run: pip install requests anthropic==0.49.0 google-genai google-api-python-client google-auth

      - name: Fetch movie data
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          MOVIE_ID: ${{ github.event.client_payload.movie_id }}
          MEDIA_TYPE: ${{ github.event.client_payload.media_type }}
          MODO: ${{ github.event.client_payload.modo }}
        run: |
          echo "MOVIE_ID=${{ github.event.client_payload.movie_id }}"
          echo "MEDIA_TYPE=${{ github.event.client_payload.media_type }}"
          echo "MODO=${{ github.event.client_payload.modo }}"
          python scripts/fetch_data.py
          ls -la movie_data.json || echo "NO SE CREO EL ARCHIVO"

      - name: Build and upload video
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/build_and_upload.py